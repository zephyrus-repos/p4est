# Configuration file for the p8est_blockforest example.
# All values are read by sc_options_load_ini on rank 0 and broadcast.
#
#   dx            grid spacing; the global grid size is derived from the
#                 AABB [min, max] and dx in each direction
#   min           lower corner x0 y0 z0 of the AABB
#   max           upper corner x1 y1 z1 of the AABB
#   block_size    number of grid cells per block in x y z
#   num_procs     expected MPI process count (must equal the actual one)
#   w             scalar value carried by every block

[Options]
dx              = 0.125
min             = 0 0 0
max             = 1 1 1
block_size      = 4 4 4
num_procs       = 4
w               = 1.0
no_vtk          = false
